name: Publish to PyPI

# Publication déclenchée par la release GitHub créée par release-please.
# DÉSACTIVÉ tant que la variable de dépôt PUBLISH_TO_PYPI n'est pas "true"
# (cf. docs/PYPI_CHECKLIST.md pour les prérequis).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) : aucun token PyPI stocké dans le dépôt.
    environment:
      name: pypi
      url: https://pypi.org/p/statflows
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
